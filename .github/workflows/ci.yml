name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            node_modules
          key: ${{ runner.os }}-bun-npm-${{ hashFiles('**/bun.lockb', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-npm-

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}

      - name: Lint
        run: bun run lint

      - name: Cache Vite Build (Lockfile + Branch)
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ runner.os }}-vite-dist-${{ github.ref_name }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-vite-dist-${{ github.ref_name }}-
            ${{ runner.os }}-vite-dist-

      - name: Typecheck & Build
        run: VITE_COMMIT_SHA=${{ github.sha }} bun run build

      - name: Unit Tests
        run: bun run test

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: E2E Tests
        run: bunx playwright test

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: |
            test-results/
            playwright-report/

      - name: Upload Exported PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: generated-pdfs/

      - name: Advanced Multi-Provider Deploy (with Fallback)
        if: success() && github.ref == 'refs/heads/main' && (secrets.VERCEL_TOKEN || secrets.NETLIFY_AUTH_TOKEN || secrets.CLOUDFLARE_API_TOKEN)
        id: deploy
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          deploy_vercel() {
            if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then return 1; fi
            echo "🚀 Deploying to Vercel..."
            npm install -g vercel@latest
            # Injecting SHA into the public health file before deploy
            jq ".commit = \"$VITE_COMMIT_SHA\"" public/health.json > dist/health.json
            vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --name ${{ github.event.repository.name }} --confirm > deploy_output.txt
            URL=$(cat deploy_output.txt | grep -o 'https://[^ ]*' | head -n 1)
            echo "url=$URL" >> $GITHUB_OUTPUT
            return 0
          }
          
          deploy_netlify() {
            if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then return 1; fi
            echo "🚀 Deploying to Netlify..."
            npm install -g netlify-cli@latest
            jq ".commit = \"$VITE_COMMIT_SHA\"" public/health.json > dist/health.json
            URL=$(netlify deploy --dir=dist --prod --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }} --json | jq -r '.deploy_url')
            echo "url=$URL" >> $GITHUB_OUTPUT
            return 0
          }

          # Tenta Vercel primeiro, depois Netlify como fallback
          deploy_vercel || deploy_netlify || { echo "❌ All deploy providers failed"; exit 1; }

      - name: Healthcheck & SHA Validation
        if: success() && steps.deploy.outputs.url != ''
        run: |
          URL=${{ steps.deploy.outputs.url }}
          EXPECTED_SHA=${{ github.sha }}
          echo "🔍 Validating $URL/health.json for SHA: $EXPECTED_SHA"
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" $URL/health.json)
            if [ "$HTTP_CODE" == "200" ]; then
              ACTUAL_SHA=$(cat response.json | jq -r '.commit')
              if [ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]; then
                echo "✅ Staging is UP and version matches SHA: $ACTUAL_SHA"
                exit 0
              fi
              echo "⚠️ Version mismatch. Found: $ACTUAL_SHA, Expected: $EXPECTED_SHA"
            fi
            echo "⏳ Waiting for propagation... ($i/10)"
            sleep 5
          done
          echo "❌ Healthcheck failed or version mismatch"
          exit 1

      - name: Notify (Discord/Slack)
        if: always() && secrets.NOTIFICATIONS_WEBHOOK
        run: |
          STATUS="✅ SUCCESS"
          [ "${{ job.status }}" == "failure" ] && STATUS="🚨 FAILED"
          
          MSG="**$STATUS** - Pipeline: ${{ github.repository }}\nBranch: \`${{ github.ref_name }}\`"
          [ -n "${{ steps.deploy.outputs.url }}" ] && MSG="$MSG\n🌍 Staging: ${{ steps.deploy.outputs.url }}"
          [ "${{ job.status }}" == "failure" ] && MSG="$MSG\n🔍 Logs & Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.NOTIFICATIONS_WEBHOOK }}
