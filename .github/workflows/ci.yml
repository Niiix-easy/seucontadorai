name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            node_modules
          key: ${{ runner.os }}-bun-npm-${{ hashFiles('**/bun.lockb', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-npm-

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}

      - name: Lint
        run: bun run lint

      - name: Cache Vite Build (Lockfile + Branch)
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ runner.os }}-vite-dist-${{ github.ref_name }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-vite-dist-${{ github.ref_name }}-
            ${{ runner.os }}-vite-dist-

      - name: Typecheck & Build
        run: VITE_COMMIT_SHA=${{ github.sha }} bun run build

      - name: Unit Tests
        run: bun run test

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: E2E Tests
        run: bunx playwright test

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: |
            test-results/
            playwright-report/

      - name: Upload Exported PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: generated-pdfs/

      - name: Advanced Multi-Provider Deploy (with Fallback)
        if: success() && github.ref == 'refs/heads/main' && (secrets.VERCEL_TOKEN || secrets.NETLIFY_AUTH_TOKEN || secrets.CLOUDFLARE_API_TOKEN)
        id: deploy
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          deploy_vercel() {
            if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then return 1; fi
            echo "🚀 Deploying to Vercel..."
            npm install -g vercel@latest
            # Injecting SHA into the public health file before deploy
            jq ".commit = \"$VITE_COMMIT_SHA\"" public/health.json > dist/health.json
            vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --name ${{ github.event.repository.name }} --confirm > deploy_output.txt
            URL=$(cat deploy_output.txt | grep -o 'https://[^ ]*' | head -n 1)
            echo "url=$URL" >> $GITHUB_OUTPUT
            return 0
          }
          
          deploy_netlify() {
            if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then return 1; fi
            echo "🚀 Deploying to Netlify..."
            npm install -g netlify-cli@latest
            jq ".commit = \"$VITE_COMMIT_SHA\"" public/health.json > dist/health.json
            URL=$(netlify deploy --dir=dist --prod --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }} --json | jq -r '.deploy_url')
            echo "url=$URL" >> $GITHUB_OUTPUT
            return 0
          }

          deploy_cloudflare() {
            if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then return 1; fi
            echo "🚀 Deploying to Cloudflare Pages..."
            npm install -g wrangler@latest
            jq ".commit = \"$VITE_COMMIT_SHA\"" public/health.json > dist/health.json
            wrangler pages deploy dist --project-name=${{ github.event.repository.name }} --branch=${{ github.ref_name }} > cf_output.txt
            URL=$(cat cf_output.txt | grep -o 'https://[^ ]*\.pages\.dev' | head -n 1)
            echo "url=$URL" >> $GITHUB_OUTPUT
            return 0
          }

          # Tenta Vercel primeiro, depois Netlify, depois Cloudflare como fallback
          deploy_vercel || deploy_netlify || deploy_cloudflare || { echo "❌ All deploy providers failed"; exit 1; }

      - name: Advanced Healthcheck, Assets & SHA Validation
        if: success() && steps.deploy.outputs.url != ''
        run: |
          URL=${{ steps.deploy.outputs.url }}
          EXPECTED_SHA=${{ github.sha }}
          echo "🔍 Validating $URL/health.json for SHA: $EXPECTED_SHA"
          
          validate_assets() {
            local base_url=$1
            echo "Checking main assets..."
            local assets=$(curl -s $base_url | grep -oE 'assets/[^"]+\.(js|css)' | sort -u)
            if [ -z "$assets" ]; then
              echo "⚠️ No assets found to validate"
              return 1
            fi
            for asset in $assets; do
              local asset_url="$base_url/$asset"
              local code=$(curl -s -o /dev/null -w "%{http_code}" "$asset_url")
              if [ "$code" != "200" ]; then
                echo "❌ Asset failed: $asset_url (HTTP $code)"
                return 1
              fi
              echo "✅ Asset OK: $asset"
            done
            return 0
          }

          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" $URL/health.json)
            if [ "$HTTP_CODE" == "200" ]; then
              ACTUAL_SHA=$(cat response.json | jq -r '.commit')
              STATUS=$(cat response.json | jq -r '.status')
              
              if [ "$STATUS" == "UP" ] && [ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]; then
                if validate_assets "$URL"; then
                  echo "✅ Staging is UP, Version matches and Assets are loading!"
                  exit 0
                fi
              fi
              echo "⚠️ Validation incomplete. Status: $STATUS, SHA: $ACTUAL_SHA"
            fi
            echo "⏳ Waiting for propagation... ($i/10)"
            sleep 5
          done
          echo "❌ Healthcheck failed or version mismatch"
          
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ] || [ "$STATUS" != "UP" ]; then
            echo "🔄 Validation failed. Attempting rollback if provider supported..."
            if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
               vercel rollback --token ${{ secrets.VERCEL_TOKEN }} --confirm || true
            fi
            # Para Netlify, o 'rollback' seria um novo deploy do commit anterior estável, 
            # que exigiria salvar o SHA estável anterior em algum lugar.
          fi
          exit 1

      - name: Production Promotion
        if: success() && github.ref == 'refs/heads/main' && steps.deploy.outputs.url != ''
        run: |
          echo "🚀 Staging validated. Promoting to Production..."
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --confirm
          elif [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            netlify deploy --dir=dist --prod --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }}
          fi

      - name: Advanced Notify (Discord/Slack)
        if: always() && secrets.NOTIFICATIONS_WEBHOOK
        run: |
          STATUS="✅ SUCCESS"
          COLOR="65280"
          [ "${{ job.status }}" == "failure" ] && STATUS="🚨 FAILED" && COLOR="16711680"
          
          ARTIFACTS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          JSON_DATA=$(cat <<EOF
          {
            "embeds": [{
              "title": "$STATUS - Pipeline: ${{ github.repository }}",
              "color": $COLOR,
              "fields": [
                {"name": "Branch", "value": "\`${{ github.ref_name }}\`", "inline": true},
                {"name": "Commit", "value": "\`${{ github.sha }}\`", "inline": true},
                {"name": "Staging URL", "value": "${{ steps.deploy.outputs.url || 'N/A' }}"},
                {"name": "Artifacts (Logs, PDFs, Videos)", "value": "[Click here to view results]($ARTIFACTS_URL)"}
              ],
              "footer": { "text": "Lovable CI/CD System" }
            }]
          }
          EOF
          )
          
          curl -X POST -H "Content-Type: application/json" -d "$JSON_DATA" ${{ secrets.NOTIFICATIONS_WEBHOOK }}
