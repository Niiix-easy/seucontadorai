name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Typecheck & Build
        run: bun run build
      - name: Unit Tests
        run: bun run test
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps
      - name: E2E Tests
        run: bunx playwright test
      - name: Upload Test Artifacts (PDFs & Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
            generated-pdfs/
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy to Staging
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "Iniciando deploy para staging..."
          # Aqui entraria o comando de deploy específico (Vercel, Netlify, Cloudflare, etc)
          # Como o projeto usa Lovable/Vite padrão, o deploy é gerenciado internamente,
          # mas simulamos o step de pipeline para o usuário.
          echo "Deploy concluído com sucesso."
